<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Activity - ReadStreak</title>

<style>
body{
    font-family:Arial;
    background:linear-gradient(135deg,#f7f8fc,#eef1ff);
    padding:30px;
    color:#222;
}

/* HEADER */
h1{
    text-align:center;
    margin-bottom:10px;
}

.sub{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

/* CARD */
.card{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-3px);
}

/* STREAK */
.streak{
    font-size:28px;
    font-weight:bold;
    color:#6d4aff;
}

/* DAYS */
.days{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

.day{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    cursor:pointer;
    transition:0.3s;
}

.day.active{
    background:#6d4aff;
    color:white;
    transform:scale(1.2);
    box-shadow:0 0 10px rgba(109,74,255,0.4);
}

/* PROGRESS BAR */
.bar{
    width:100%;
    height:10px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.bar span{
    display:block;
    height:100%;
    background:linear-gradient(90deg,#6d4aff,#00d4ff);
    width:0%;
}

/* BUTTON */
.btn{
    margin-top:10px;
    padding:8px 12px;
    border:none;
    background:#6d4aff;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.btn:hover{
    background:#5636ff;
}

/* BADGES */
.badges{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.badge{
    padding:6px 10px;
    background:#eee;
    border-radius:20px;
    font-size:12px;
}

.badge.good{
    background:#6d4aff;
    color:white;
}

/* SUGGESTION */
.suggest{
    font-style:italic;
    color:#444;
}

/* BACK */
.back{
    display:block;
    text-align:center;
    margin-top:30px;
    text-decoration:none;
    background:#333;
    color:white;
    padding:12px;
    border-radius:10px;
    width:200px;
    margin-left:auto;
    margin-right:auto;
}
</style>

</head>

<body>

<h1>📊 Activity Pro Max</h1>
<p class="sub">Your reading journey dashboard 🚀</p>

<div class="grid">

<!-- STREAK -->
<div class="card">
    <h3>🔥 Current Streak</h3>
    <div class="streak" id="streak"></div>
    <p id="streakInfo"></p>
</div>

<!-- WEEK -->
<div class="card">
    <h3>📅 Weekly Activity</h3>
    <div class="days" id="days"></div>
</div>

<!-- TIME -->
<div class="card">
    <h3>⏱ Reading Time</h3>
    <p id="time"></p>

    <div class="bar">
        <span id="timeBar"></span>
    </div>

    <div style="margin-top:10px;">
        <button class="btn" onclick="addTime()">+ 10 min</button>
        <button class="btn" onclick="removeTime()" style="background:#ff4d4d;">
            - 10 min
        </button>
    </div>
</div>

<!-- SUGGESTION -->
<div class="card">
    <h3>💬 Smart Suggestion</h3>
    <p class="suggest" id="suggest"></p>
</div>

<!-- BADGES -->
<div class="card">
    <h3>🏆 Badges</h3>
    <div class="badges" id="badges"></div>
</div>

</div>

<a href="dashboard.html" class="back">⬅ Back to Dashboard</a>
<script src="storage.js"></script>
<script>

let data = JSON.parse(localStorage.getItem("activityPro")) || {
    days:[0,0,0,0,0,0,0],
    minutes:0
};

const labels = ["S","M","T","W","T","F","S"];

// SAVE
function save(){
    localStorage.setItem("activityPro", JSON.stringify(data));
}

// STREAK
function getStreak(){
    let s=0;
    for(let i=data.days.length-1;i>=0;i--){
        if(data.days[i]===1) s++;
        else break;
    }
    return s;
}

// DAYS
function renderDays(){
    let c=document.getElementById("days");
    c.innerHTML="";

    data.days.forEach((v,i)=>{
        let d=document.createElement("div");
        d.className="day";
        if(v===1) d.classList.add("active");
        d.innerText=labels[i];

        d.onclick=()=>{
            data.days[i]=data.days[i]===1?0:1;
            save();
            renderAll();
        };

        c.appendChild(d);
    });
}

// STREAK
function renderStreak(){
    let s=getStreak();
    document.getElementById("streak").innerText=s;

    document.getElementById("streakInfo").innerText=
        s<3?"Start building your streak 📚":
        s<5?"Nice! Keep going 🔥":"Amazing consistency 🚀";
}

// TIME
function renderTime(){
    let m=data.minutes;

    document.getElementById("time").innerText=
        m+" min this week";

    let percent = Math.min((m/120)*100,100);
    document.getElementById("timeBar").style.width=percent+"%";
}

// ADD TIME
function addTime(){
    data.minutes += 10;
    save();
    renderAll();
}

// REMOVE TIME
function removeTime(){
    data.minutes -= 10;
    if(data.minutes < 0){
        data.minutes = 0;
    }
    save();
    renderAll();
}

// SUGGESTION
function renderSuggest(){
    let s=getStreak();

    let msg =
        s===0?"Read today to start your streak 📚":
        s<3?"You're building momentum 🔥":
        "You're unstoppable 🚀";

    document.getElementById("suggest").innerText=msg;
}

// BADGES
function renderBadges(){
    let b=[];

    if(getStreak()>=1) b.push("📘 Starter");
    if(getStreak()>=3) b.push("🔥 Focused");
    if(getStreak()>=5) b.push("⚡ Consistent");
    if(data.minutes>=60) b.push("⏱ Time Keeper");

    document.getElementById("badges").innerHTML=
        b.map(x=>`<span class="badge good">${x}</span>`).join("");
}

// MASTER
function renderAll(){
    renderDays();
    renderStreak();
    renderTime();
    renderSuggest();
    renderBadges();
}

renderAll();

</script>

</body>
</html>
