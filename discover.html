<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover - ReadStreak</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Inter',sans-serif;
    background:#f7f8fc;
    padding:50px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h1{
    font-size:34px;
}

.back-btn{
    background:#6d4aff;
    color:white;
    padding:10px 16px;
    border-radius:10px;
    text-decoration:none;
}

.search-box{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
    margin-bottom:20px;
    outline:none;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.card h2{
    margin-bottom:10px;
}

.book{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px;
    background:#f4f4f4;
    margin:10px 0;
    border-radius:10px;
    transition:0.2s;
}

.book:hover{
    transform:scale(1.02);
}

button{
    background:#6d4aff;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

button:disabled{
    background:gray;
    cursor:not-allowed;
}
</style>
</head>

<body>

<div class="header">
    <h1>🔍 Discover Books</h1>
 
    <a href="dashboard.html" class="back-btn">← Back</a>
    <script src="storage.js"></script> 
</div>

<input class="search-box" id="searchBox" placeholder="Search books...">

<!-- TRENDING -->
<div class="card">
<h2>Trending Books</h2>

<div class="book">
    <span>Atomic Habits</span>
    <button onclick="addBook('Atomic Habits', this)">Add</button>
</div>

<div class="book">
    <span>Deep Work</span>
    <button onclick="addBook('Deep Work', this)">Add</button>
</div>

<div class="book">
    <span>Psychology of Money</span>
    <button onclick="addBook('Psychology of Money', this)">Add</button>
</div>
</div>

<!-- RECOMMENDED -->
<div class="card">
<h2>Recommended For You</h2>

<div class="book">
    <span>The Power of Habit</span>
    <button onclick="addBook('The Power of Habit', this)">Add</button>
</div>

<div class="book">
    <span>The Lean Startup</span>
    <button onclick="addBook('The Lean Startup', this)">Add</button>
</div>
</div>

<!-- NEW -->
<div class="card">
<h2>New Releases</h2>

<div class="book">
    <span>Future Thinking</span>
    <button onclick="addBook('Future Thinking', this)">Add</button>
</div>

<div class="book">
    <span>The Creative Mind</span>
    <button onclick="addBook('The Creative Mind', this)">Add</button>
</div>
</div>

<script>

// LOAD BOOKS FROM STORAGE
let books = JSON.parse(localStorage.getItem("books")) || [];

// SEARCH FEATURE
document.getElementById("searchBox").addEventListener("input", function(){
    let value = this.value.toLowerCase();

    document.querySelectorAll(".book").forEach(book => {
        book.style.display = book.innerText.toLowerCase().includes(value)
        ? "flex" : "none";
    });
});

// CHECK ALREADY ADDED ON LOAD
window.onload = () => {
    document.querySelectorAll(".book").forEach(card => {

        let name = card.querySelector("span").innerText;
        let btn = card.querySelector("button");

        if(books.find(b => b.name === name)){
            btn.innerText = "✔ Added";
            btn.disabled = true;
        }
    });
};

// ADD BOOK FUNCTION
function addBook(name, btn){

    let exists = books.find(b => b.name === name);

    if(exists){
        btn.innerText = "✔ Added";
        btn.disabled = true;
        return;
    }

    books.push({
        name: name,
        progress: 0
    });

    localStorage.setItem("books", JSON.stringify(books));

    btn.innerText = "✔ Added";
    btn.disabled = true;
}

</script>

</body>
</html>
